name: Continuous Integration
on:
  pull_request:
    branches: [ "main" ]

env:
  QT_VERSION: '6.10.3'

jobs:
  build-gcc-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        install-deps: 'true'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Install gcovr
      run: python -m pip install gcovr

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_BUILD_TYPE=Release
        -DQTD_ENABLE_COVERAGE=ON
        -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
        -S ${{ github.workspace }}

    - name: Build all targets
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} -j 8

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: GNU-build
        path: ${{ steps.strings.outputs.build-output-dir }}

  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            cpp_compiler: clang++
            build_type: Release
            sanitize_flags: ""
            parallel_jobs: 8
            ctest_repeat: "--repeat until-fail:10"

          - os: ubuntu-latest
            cpp_compiler: g++
            build_type: Release
            sanitize_flags: ""
            parallel_jobs: 8
            ctest_repeat: "--repeat until-fail:10"

          - os: ubuntu-latest
            cpp_compiler: clang++
            build_type: Release
            sanitize_flags: "-DQTD_ENABLE_SANITIZERS=ON"
            parallel_jobs: 4
            ctest_repeat: ""

          - os: windows-latest
            cpp_compiler: cl
            build_type: Release
            sanitize_flags: ""
            parallel_jobs: 8
            ctest_repeat: "--repeat until-fail:10"

          - os: ubuntu-latest
            cpp_compiler: g++
            build_type: Debug
            sanitize_flags: "-DQTD_ENABLE_SANITIZERS=ON"
            parallel_jobs: 4
            ctest_repeat: ""

          - os: ubuntu-latest
            cpp_compiler: clang++
            build_type: Debug
            sanitize_flags: "-DQTD_ENABLE_SANITIZERS=ON"
            parallel_jobs: 4
            ctest_repeat: ""

          - os: windows-latest
            cpp_compiler: cl
            build_type: Debug
            sanitize_flags: ""
            parallel_jobs: 4
            ctest_repeat: ""

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        install-deps: 'true'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.sanitize_flags }}
        -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
        -S ${{ github.workspace }}

    - name: Build all targets
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j ${{ matrix.parallel_jobs }}

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: >
        ctest --test-dir ${{ steps.strings.outputs.build-output-dir }}
        -C ${{ matrix.build_type }}
        ${{ matrix.ctest_repeat }}
        -j ${{ matrix.parallel_jobs }}
        --output-on-failure

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-logs-${{ matrix.os }}-${{ matrix.cpp_compiler }}-${{ matrix.build_type }}
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/

  test-gcc-release:
    needs: build-gcc-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Receive cached build directory
      uses: actions/download-artifact@v8
      with:
        name: GNU-build
        path: ${{ steps.strings.outputs.build-output-dir }}

    - name: Fix execute permissions
      run: chmod -R +x ${{ steps.strings.outputs.build-output-dir }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: >
        ctest --test-dir ${{ steps.strings.outputs.build-output-dir }}
        -C Release --repeat until-fail:10 -j8 --output-on-failure

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-logs-ubuntu-latest-g++-Release
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/

  test-coverage:
    needs: build-gcc-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Install gcovr
      run: python -m pip install gcovr

    - name: Receive caches build directory
      uses: actions/download-artifact@v8
      with:
        name: GNU-build
        path: ${{ steps.strings.outputs.build-output-dir }}

    - name: Fix execute permissions
      run: chmod -R +x ${{ steps.strings.outputs.build-output-dir }}

    - name: Generate coverage report & verify thresholds
      run: QT_QPA_PLATFORM=offscreen cmake --build ${{ steps.strings.outputs.build-output-dir }} --target check-coverage

    - name: Cache coverage artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ${{ steps.strings.outputs.build-output-dir }}/gcovr

  code-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: License check
      shell: bash
      run: bash ./scripts/verify_license_headers.sh

    - name: Validate there is no direct usage of QUuid
      shell: bash
      run: bash ./scripts/verify_no_quuid_usage.sh

    - name: Validate there are no include guards
      shell: bash
      run: bash ./scripts/verify_no_include_guards.sh

  qmllint:
    needs: build-gcc-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Receive cached build directory
      uses: actions/download-artifact@v8
      with:
        name: GNU-build
        path: ${{ steps.strings.outputs.build-output-dir }}

    - name: Fix execute permissions
      run: chmod -R +x ${{ steps.strings.outputs.build-output-dir }}

    - name: Run qmllint
      shell: bash
      run: bash ./scripts/run_qmllint.sh ${{ steps.strings.outputs.build-output-dir }}

  clang-tidy:
    needs: build-gcc-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Receive caches build directory
      uses: actions/download-artifact@v8
      with:
        name: GNU-build
        path: ${{ steps.strings.outputs.build-output-dir }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        install-deps: 'true'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Install clang-tidy 21
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt-get install -y clang-tidy-21

    - name: Run clang-tidy
      shell: bash
      env:
        CLANG_TIDY: run-clang-tidy-21
      run: ./scripts/run_linter_on_changed_files.sh ${{ steps.strings.outputs.build-output-dir }}

  summary:
    needs: [code-checks, test-gcc-release, test-coverage, clang-tidy, build-and-test, qmllint]
    runs-on: ubuntu-latest
    steps:
    - name: Print success message
      shell: bash
      run: echo "All checks passed successfully."
